name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: diti4-spring-boot

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: diti4_pring_mvc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Nabou988
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d diti4_pring_mvc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + tests Maven
        env:
          DB_HOST: localhost
          DB_NAME: diti4_pring_mvc
          DB_USER: postgres
          DB_PASSWORD: Nabou988
        run: mvn -B clean verify

      - name: Uploader le .jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker-push:
    name: Build & push image Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    # On ne pousse l'image que sur main, pas sur les PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max