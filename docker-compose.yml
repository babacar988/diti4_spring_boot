services:
  db:
    image: postgres:16-alpine
    container_name: diti4-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-diti4}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nabou988}
    ports:
      - "5432:5432"
    volumes:
      - diti4-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-diti4}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: diti4-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-diti4}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Nabou988}
    ports:
      - "8080:8080"

volumes:
  diti4-db-data:
