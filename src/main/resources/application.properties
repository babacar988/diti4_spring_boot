spring.application.name=diti4_spring_boot

#spring.datasource.url=jdbc:postgresql://localhost:5432/diti4_pring_mvc
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:diti4_pring_mvc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Nabou988}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8081
